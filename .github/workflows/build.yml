name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src/pubspec.yaml') }}
          restore-keys: gradle-
      - name: Speed up Gradle (skip lint, parallel)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/skip-lint.gradle <<'GRADLE'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith('lint')) { t.enabled = false }
            }
          }
          GRADLE
          printf 'org.gradle.parallel=true\norg.gradle.caching=true\norg.gradle.daemon=false\nandroid.enableR8.fullMode=false\n' >> ~/.gradle/gradle.properties
      - name: Create Flutter project
        run: flutter create --org com.sultan --project-name server_admin --platforms android app
      - name: Apply sources
        run: |
          cp src/pubspec.yaml app/pubspec.yaml
          rm -rf app/lib app/test
          cp -r src/lib app/lib
          M=app/android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' $M
          sed -i 's/android:label="[^"]*"/android:label="إدارة السيرفرات"/' $M
      - name: Build
        run: |
          cd app
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: ServerAdmin-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
