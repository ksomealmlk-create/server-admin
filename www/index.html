<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إدارة السيرفرات</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:#0f1115;color:#eee;padding:env(safe-area-inset-top) 0 70px}
header{padding:14px 16px;background:#171a21;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0}
.bal{font-size:13px;color:#8bd5a0}
main{padding:12px}
.card{background:#1b1f27;border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button,select,input{font-size:15px;padding:10px 12px;border-radius:10px;border:0;background:#2a2f3a;color:#eee}
input,select{width:100%;margin-top:6px}
button{background:#2d7ff9;color:#fff}
button.red{background:#d33}button.gray{background:#3a404d}button.grn{background:#1f9d55}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#171a21;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border-radius:0;background:none;padding:14px;color:#9aa}
nav button.on{color:#fff;border-top:2px solid #2d7ff9}
.ip{font-size:20px;font-weight:bold;direction:ltr;text-align:right}
.tag{font-size:12px;background:#2a2f3a;padding:3px 8px;border-radius:8px;margin-left:4px}
.ok{color:#5fd38a}.bad{color:#ff7a7a}
code{display:block;background:#0b0d11;padding:8px;border-radius:8px;direction:ltr;text-align:left;font-size:12px;word-break:break-all;margin-top:6px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:20px;display:none;z-index:9}
.hide{display:none}
</style>
</head>
<body>
<header><h1>إدارة السيرفرات</h1><div class="bal" id="bal"></div></header>
<main>
 <section id="t-list">
  <div class="row"><button onclick="loadAll()">تحديث</button></div>
  <div id="list">...</div>
 </section>

 <section id="t-new" class="hide">
  <div class="card">
   <b>إنشاء سيرفر جديد</b>
   <select id="region">
    <option value="fra1">فرانكفورت (fra1)</option>
    <option value="lon1">لندن (lon1)</option>
    <option value="ams2">أمستردام (ams2)</option>
    <option value="ams3">أمستردام (ams3)</option>
    <option value="blr1">بنغالور (blr1)</option>
    <option value="sgp1">سنغافورة (sgp1)</option>
    <option value="nyc1">نيويورك (nyc1)</option>
    <option value="tor1">تورنتو (tor1)</option>
   </select>
   <select id="size">
    <option value="s-1vcpu-512mb-10gb">512MB — $4</option>
    <option value="s-1vcpu-1gb">1GB — $6</option>
    <option value="s-1vcpu-2gb">2GB — $12</option>
   </select>
   <input id="name" placeholder="الاسم (اختياري)">
   <div class="row"><button class="grn" onclick="createDroplet()">إنشاء</button></div>
   <div id="newmsg"></div>
  </div>
  <div class="card">
   <b>تثبيت لوحة 3x-ui بعد الإنشاء</b>
   <div style="font-size:13px;margin-top:6px">ادخل السيرفر بـ SSH ونفّذ:</div>
   <code id="xui">bash &lt;(curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh)</code>
   <div class="row"><button class="gray" onclick="copyText('bash <(curl -Ls https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh)')">نسخ الأمر</button></div>
  </div>
 </section>

 <section id="t-set" class="hide">
  <div class="card">
   <b>توكن DigitalOcean</b>
   <input id="token" type="password" placeholder="dop_v1_...">
   <div class="row">
    <button onclick="saveToken()">حفظ</button>
    <button class="red" onclick="logout()">مسح التوكن</button>
   </div>
   <div style="font-size:12px;color:#aaa;margin-top:8px">التوكن يُحفظ داخل التطبيق على جهازك فقط. لا ترسله لأي أحد.</div>
  </div>
  <div class="card">
   <b>مفاتيح SSH بحسابك</b>
   <div id="keys">-</div>
  </div>
 </section>
</main>

<nav>
 <button id="n-list" class="on" onclick="tab('list')">السيرفرات</button>
 <button id="n-new" onclick="tab('new')">إنشاء</button>
 <button id="n-set" onclick="tab('set')">الإعدادات</button>
</nav>
<div id="toast"></div>

<script>
var API="https://api.digitalocean.com/v2";
var TOKEN="";
try{TOKEN=localStorage.getItem("do_token")||""}catch(e){}
var KEYS=[];

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";setTimeout(function(){t.style.display="none"},2500)}
function copyText(s){
  try{navigator.clipboard.writeText(s);toast("تم النسخ")}catch(e){toast("تعذّر النسخ")}
}
function tab(n){
  ["list","new","set"].forEach(function(x){
    $("t-"+x).classList.toggle("hide",x!==n);
    $("n-"+x).classList.toggle("on",x===n);
  });
  if(n==="set")loadKeys();
}

async function api(method,path,body){
  var opt={method:method,headers:{"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"}};
  if(body)opt.body=JSON.stringify(body);
  var r=await fetch(API+path,opt);
  var txt=await r.text();
  var j={};
  try{j=txt?JSON.parse(txt):{}}catch(e){j={message:txt}}
  if(r.status>=400)throw new Error((j.message||("HTTP "+r.status)));
  return j;
}

function saveToken(){
  var v=$("token").value.trim();
  if(!v){toast("الصق التوكن");return}
  TOKEN=v;
  try{localStorage.setItem("do_token",v)}catch(e){}
  $("token").value="";
  toast("تم الحفظ");
  tab("list");loadAll();
}
function logout(){
  TOKEN="";
  try{localStorage.removeItem("do_token")}catch(e){}
  $("list").innerHTML="";$("bal").textContent="";
  toast("تم المسح");
}

async function loadBalance(){
  try{
    var b=await api("GET","/customers/my/balance");
    $("bal").textContent="الحساب: $"+b.month_to_date_usage+" هذا الشهر";
  }catch(e){$("bal").textContent=""}
}
async function loadKeys(){
  if(!TOKEN){$("keys").textContent="أدخل التوكن أولًا";return}
  try{
    var j=await api("GET","/account/keys");
    KEYS=(j.ssh_keys||[]).map(function(k){return k.id});
    $("keys").innerHTML=(j.ssh_keys||[]).map(function(k){return '<span class="tag">'+esc(k.name)+'</span>'}).join("")||"لا يوجد مفاتيح (راح يوصلك باسوورد root بالإيميل)";
  }catch(e){$("keys").textContent=e.message}
}

async function loadAll(){
  if(!TOKEN){$("list").innerHTML='<div class="card">أدخل التوكن من تبويب الإعدادات</div>';tab("set");return}
  $("list").textContent="جاري التحميل...";
  try{
    var j=await api("GET","/droplets");
    var ds=j.droplets||[];
    if(!ds.length){$("list").innerHTML='<div class="card">لا يوجد سيرفرات</div>'}
    else $("list").innerHTML=ds.map(function(d){
      var n=(d.networks.v4||[]).filter(function(x){return x.type==="public"})[0];
      var ip=n?n.ip_address:"pending";
      return '<div class="card" id="d'+d.id+'">'+
        '<b>'+esc(d.name)+'</b> <span class="tag">'+esc(d.region.slug)+'</span><span class="tag">'+esc(d.size_slug)+'</span>'+
        '<span class="tag '+(d.status==="active"?"ok":"bad")+'">'+esc(d.status)+'</span>'+
        '<div class="ip">'+esc(ip)+'</div><div id="p'+d.id+'" style="font-size:13px;margin-top:4px"></div>'+
        '<div class="row">'+
        '<button onclick="pingIp(\''+ip+'\','+d.id+')">فحص التأخير</button>'+
        '<button class="gray" onclick="copyText(\''+ip+'\')">نسخ IP</button>'+
        '<button class="gray" onclick="copyText(\'ssh root@'+ip+'\')">نسخ SSH</button>'+
        '<button class="gray" onclick="act('+d.id+',\'reboot\')">إعادة تشغيل</button>'+
        '<button class="red" onclick="del('+d.id+',\''+esc(d.name)+'\')">حذف</button>'+
        '</div></div>';
    }).join("");
    loadBalance();
  }catch(e){$("list").innerHTML='<div class="card bad">'+esc(e.message)+'</div>'}
}

async function pingIp(ip,id){
  var el=$("p"+id);
  if(ip==="pending"){el.textContent="السيرفر لسه ما جاهز";return}
  el.textContent="جاري الفحص...";
  var times=[];
  for(var i=0;i<4;i++){
    var t=performance.now();
    try{
      await Promise.race([fetch("http://"+ip+":22"),new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout"))},4000)})]);
    }catch(e){}
    var dt=Math.round(performance.now()-t);
    if(dt<3900)times.push(dt);
  }
  if(!times.length){el.innerHTML='<span class="bad">ما كو استجابة</span>';return}
  var avg=Math.round(times.reduce(function(a,b){return a+b},0)/times.length);
  var cls=avg<120?"ok":(avg<200?"":"bad");
  el.innerHTML='التأخير التقريبي: <b class="'+cls+'">'+avg+' ms</b> ('+times.join(", ")+')';
}

async function createDroplet(){
  if(!TOKEN){toast("أدخل التوكن");return}
  var region=$("region").value;
  var body={name:($("name").value.trim()||("vpn-"+region)),region:region,size:$("size").value,image:"ubuntu-24-04-x64"};
  if(!KEYS.length){try{await loadKeys()}catch(e){}}
  if(KEYS.length)body.ssh_keys=KEYS;
  $("newmsg").textContent="جاري الإنشاء...";
  try{
    var j=await api("POST","/droplets",body);
    $("newmsg").innerHTML='<span class="ok">تم الإنشاء (ID: '+j.droplet.id+'). حدّث القائمة بعد دقيقة.</span>';
  }catch(e){$("newmsg").innerHTML='<span class="bad">'+esc(e.message)+'</span>'}
}

async function del(id,name){
  if(!confirm("حذف السيرفر "+name+" ؟"))return;
  try{await api("DELETE","/droplets/"+id);toast("تم الحذف");loadAll()}catch(e){toast(e.message)}
}
async function act(id,type){
  if(!confirm("تأكيد؟"))return;
  try{await api("POST","/droplets/"+id+"/actions",{type:type});toast("تم")}catch(e){toast(e.message)}
}

loadKeys().then(loadAll);
</script>
</body>
</html>
